name: Content

# The content rules in AGENTS.md that a script can check: assignment snippets
# match their code, one SDK per Workshop, and every Challenge ends by asking
# for feedback. Runs scripts/verify-content.sh on every PR.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Snippets, one SDK, feedback
        run: bash scripts/verify-content.sh
