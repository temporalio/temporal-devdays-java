<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="title desc">
  <title id="title">DevDays Java</title>
  <desc id="desc">Ziggy the tardigrade bobs beside a steaming cup of coffee, next to the words DevDays Java.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0B1A"/>
      <stop offset="0.55" stop-color="#15123A"/>
      <stop offset="1" stop-color="#241552"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7B61FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7B61FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="java" gradientUnits="userSpaceOnUse" x1="470" y1="0" x2="690" y2="0">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="0.5" stop-color="#F472B6"/>
      <stop offset="1" stop-color="#FDBA74"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D9CCFF"/>
      <stop offset="1" stop-color="#9F86FF"/>
    </linearGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCD6F7"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="340" rx="28"/></clipPath>
  </defs>

  <style>
    .bob     { animation: bob 3.2s ease-in-out infinite; }
    .shadow  { animation: shadow 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .eye     { animation: blink 4.8s infinite; transform-box: fill-box; transform-origin: center; }
    .leg     { transform-box: fill-box; transform-origin: 50% 0%; animation: wiggle 0.9s ease-in-out infinite alternate; }
    .leg.b   { animation-delay: -0.45s; }
    .wave    { transform-box: fill-box; transform-origin: 50% 90%; animation: wave 1.6s ease-in-out infinite; }
    .steam   { animation: steam 3s ease-in-out infinite; opacity: 0; }
    .steam.s2 { animation-delay: -1s; }
    .steam.s3 { animation-delay: -2s; }
    .spark   { transform-box: fill-box; transform-origin: center; animation: twinkle 2.4s ease-in-out infinite; }
    .spark.t2 { animation-delay: -0.8s; }
    .spark.t3 { animation-delay: -1.6s; }
    .drift   { animation: drift 14s ease-in-out infinite alternate; }

    @keyframes bob     { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
    @keyframes shadow  { 0%, 100% { transform: scaleX(1); opacity: .45; } 50% { transform: scaleX(.86); opacity: .28; } }
    @keyframes blink   { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.08); } }
    @keyframes wiggle  { from { transform: rotate(-9deg); } to { transform: rotate(9deg); } }
    @keyframes wave    { 0%, 100% { transform: rotate(-14deg); } 50% { transform: rotate(18deg); } }
    @keyframes steam   { 0% { opacity: 0; transform: translateY(8px); } 30% { opacity: .85; } 100% { opacity: 0; transform: translateY(-26px); } }
    @keyframes twinkle { 0%, 100% { transform: scale(.4); opacity: .2; } 50% { transform: scale(1); opacity: 1; } }
    @keyframes drift   { from { transform: translate(0, 0); } to { transform: translate(-40px, 18px); } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .steam { opacity: .7; }
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#dots)"/>
    <g class="drift">
      <circle cx="930" cy="150" r="260" fill="url(#glowA)"/>
      <circle cx="210" cy="330" r="220" fill="url(#glowB)"/>
    </g>
    <!-- orbit lines -->
    <ellipse cx="930" cy="190" rx="250" ry="70" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1.5" transform="rotate(-8 930 190)"/>
    <ellipse cx="930" cy="190" rx="190" ry="48" fill="none" stroke="#A78BFA" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="4 8" transform="rotate(-8 930 190)"/>
  </g>
  <rect x="0.75" y="0.75" width="1198.5" height="338.5" rx="27.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5"/>

  <!-- Wordmark -->
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
    <text x="72" y="98" fill="#A5B4FC" font-size="17" font-weight="600" letter-spacing="4">TEMPORAL · HANDS-ON WORKSHOPS</text>
    <text x="68" y="196" fill="#FFFFFF" font-size="96" font-weight="800" letter-spacing="-3">DevDays <tspan fill="url(#java)">Java</tspan></text>
    <text x="72" y="240" fill="#C7C9E8" font-size="22" font-weight="400">Durable execution, one Challenge at a time.</text>
    <g font-size="14" font-weight="600" fill="#E0E7FF">
      <rect x="72" y="266" width="66" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.08" stroke="#A78BFA" stroke-opacity="0.45"/>
      <text x="105" y="286" text-anchor="middle">Saga</text>
      <rect x="148" y="266" width="138" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.08" stroke="#A78BFA" stroke-opacity="0.45"/>
      <text x="217" y="286" text-anchor="middle">Child Workflows</text>
      <rect x="296" y="266" width="154" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.08" stroke="#A78BFA" stroke-opacity="0.45"/>
      <text x="373" y="286" text-anchor="middle">Continue-As-New</text>
      <rect x="460" y="266" width="106" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.08" stroke="#A78BFA" stroke-opacity="0.45"/>
      <text x="513" y="286" text-anchor="middle">Heartbeats</text>
    </g>
  </g>

  <!-- Sparkles -->
  <g fill="#FDE68A">
    <path class="spark" d="M760 70 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z"/>
    <path class="spark t2" d="M1110 92 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z" fill="#C4B5FD"/>
    <path class="spark t3" d="M1080 268 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z"/>
    <path class="spark t2" d="M700 220 l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5z" fill="#99F6E4"/>
  </g>

  <!-- Ground shadows -->
  <ellipse class="shadow" cx="918" cy="292" rx="118" ry="11" fill="#000000"/>
  <ellipse cx="1062" cy="292" rx="38" ry="7" fill="#000000" opacity=".4"/>

  <!-- Coffee cup -->
  <g>
    <path class="steam"    d="M1050 196 c-8 -10 8 -16 0 -28" fill="none" stroke="#E9E5FF" stroke-width="4" stroke-linecap="round"/>
    <path class="steam s2" d="M1064 194 c-8 -10 8 -16 0 -28" fill="none" stroke="#E9E5FF" stroke-width="4" stroke-linecap="round"/>
    <path class="steam s3" d="M1078 196 c-8 -10 8 -16 0 -28" fill="none" stroke="#E9E5FF" stroke-width="4" stroke-linecap="round"/>
    <path d="M1090 228 h8 a14 14 0 0 1 0 28 h-10" fill="none" stroke="#DCD6F7" stroke-width="7"/>
    <path d="M1030 210 h68 l-6 70 a10 10 0 0 1 -10 9 h-36 a10 10 0 0 1 -10 -9z" fill="url(#cup)"/>
    <rect x="1026" y="204" width="76" height="10" rx="5" fill="#FFFFFF"/>
    <path d="M1040 244 q24 -12 48 0" fill="none" stroke="#7B61FF" stroke-width="4" stroke-linecap="round"/>
    <path d="M1044 258 q20 -9 40 0" fill="none" stroke="#F472B6" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Ziggy the tardigrade -->
  <g class="bob">
    <!-- back legs (behind body) -->
    <g fill="#8B72F0" stroke="#5B45C9" stroke-width="2.5">
      <g class="leg b"><rect x="828" y="244" width="24" height="34" rx="12"/></g>
      <g class="leg"><rect x="880" y="250" width="24" height="32" rx="12"/></g>
      <g class="leg b"><rect x="932" y="250" width="24" height="32" rx="12"/></g>
      <g class="leg"><rect x="984" y="244" width="24" height="34" rx="12"/></g>
    </g>

    <!-- body: soft segmented barrel -->
    <path d="M806 214 c0 -58 52 -92 116 -92 c66 0 108 34 108 90 c0 46 -40 64 -108 64 c-72 0 -116 -16 -116 -62z" fill="url(#body)" stroke="#5B45C9" stroke-width="3"/>
    <g fill="none" stroke="#7C63E8" stroke-width="3" stroke-linecap="round" opacity=".55">
      <path d="M880 130 q-12 72 6 144"/>
      <path d="M936 124 q-10 78 4 152"/>
      <path d="M988 140 q-6 64 4 128"/>
    </g>
    <!-- belly highlight and spots -->
    <ellipse cx="900" cy="160" rx="70" ry="20" fill="#FFFFFF" opacity=".22"/>
    <g fill="#FFFFFF" opacity=".35">
      <circle cx="960" cy="168" r="5"/>
      <circle cx="1002" cy="190" r="4"/>
      <circle cx="914" cy="150" r="3.5"/>
    </g>

    <!-- front legs (in front of body) -->
    <g fill="#A992FF" stroke="#5B45C9" stroke-width="2.5">
      <g class="leg"><rect x="846" y="252" width="26" height="36" rx="13"/></g>
      <g class="leg b"><rect x="906" y="258" width="26" height="34" rx="13"/></g>
      <g class="leg"><rect x="962" y="252" width="26" height="36" rx="13"/></g>
    </g>
    <g fill="#5B45C9">
      <circle cx="852" cy="286" r="2.5"/><circle cx="859" cy="288" r="2.5"/><circle cx="866" cy="286" r="2.5"/>
      <circle cx="912" cy="290" r="2.5"/><circle cx="919" cy="292" r="2.5"/><circle cx="926" cy="290" r="2.5"/>
      <circle cx="968" cy="286" r="2.5"/><circle cx="975" cy="288" r="2.5"/><circle cx="982" cy="286" r="2.5"/>
    </g>

    <!-- waving arm, toward the cup -->
    <g class="wave">
      <rect x="1014" y="168" width="24" height="46" rx="12" fill="#A992FF" stroke="#5B45C9" stroke-width="2.5" transform="rotate(-38 1026 210)"/>
    </g>

    <!-- head -->
    <circle cx="812" cy="196" r="56" fill="url(#body)" stroke="#5B45C9" stroke-width="3"/>
    <ellipse cx="796" cy="166" rx="24" ry="11" fill="#FFFFFF" opacity=".3"/>
    <!-- eyes -->
    <g class="eye">
      <ellipse cx="792" cy="190" rx="11" ry="13" fill="#1E1B4B"/>
      <circle cx="796" cy="185" r="4" fill="#FFFFFF"/>
    </g>
    <g class="eye">
      <ellipse cx="832" cy="190" rx="11" ry="13" fill="#1E1B4B"/>
      <circle cx="836" cy="185" r="4" fill="#FFFFFF"/>
    </g>
    <!-- cheeks -->
    <ellipse cx="776" cy="212" rx="9" ry="5.5" fill="#F472B6" opacity=".55"/>
    <ellipse cx="850" cy="212" rx="9" ry="5.5" fill="#F472B6" opacity=".55"/>
    <!-- snout: the tardigrade's little tube mouth -->
    <ellipse cx="812" cy="222" rx="13" ry="10" fill="#C9B9FF" stroke="#5B45C9" stroke-width="2.5"/>
    <ellipse cx="812" cy="223" rx="5" ry="4" fill="#3B2A8F"/>
  </g>
</svg>
