version: "3"
containers:
- name: workshop
  # Pinned by digest, not :latest. A moving tag lets a sandbox boot a cached older
  # image. Re-pin after every rebuild with:
  #   docker buildx imagetools inspect ghcr.io/nadvolod/continue-as-new-java-sandbox:latest --format "{{.Manifest.Digest}}"
  image: ghcr.io/nadvolod/continue-as-new-java-sandbox@sha256:1f7ded64e0d8d872f076f995df1d02d0d370e5beffa16e24ae6b2cc154910360
  shell: /bin/bash
  # One Java Worker, a Temporal dev server, one code-server with the Java
  # language server (~1 GB on its own), and Maven Checks.
  memory: 6144
  # Every port a tab points at MUST be listed here. Instruqt's proxy cannot reach
  # an undeclared port, and the tab shows "Please wait" forever.
  ports:
  - 8233   # Temporal UI
  - 8080   # code-server, the Exercise tab
