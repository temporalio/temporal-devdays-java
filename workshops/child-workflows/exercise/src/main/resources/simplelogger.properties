# Quiet the SDK's own logging so the Worker tab shows the Workshop's output.
org.slf4j.simpleLogger.defaultLogLevel=warn
org.slf4j.simpleLogger.log.io.temporal.devdays=info
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showShortLogName=true
# A failing chain is expected in Challenge 2. Keep each level's stack trace out
# of the Worker tab; the Temporal UI has every failure in full.
org.slf4j.simpleLogger.log.io.temporal.internal.sync.WorkflowExecutionHandler=error
