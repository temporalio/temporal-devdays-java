title: Child Workflows (Java)
teaser: Start a child, chain children five deep, fan out, then write the fan in.
description: |-
  A Child Workflow is a Workflow started by another Workflow. It gets its own
  Workflow ID, its own Event History and its own lifecycle, and the parent can
  wait for its result.

  Four short Challenges:

  1. Run one child and read both histories.
  2. Chain children five deep, fail the bottom one, and follow the error up.
  3. Fan out: start one child per item and close the parent without waiting. Watch the children get terminated.
  4. Fan in: wait for every child with `Promise.allOf` and collect the results.

  Challenges 1 to 3 are run and observe. Challenge 4 is one TODO. Every Check
  tells you what is missing and where.

  **Prerequisite:** Temporal Essentials. You should already know what a Workflow
  and a Worker are.
