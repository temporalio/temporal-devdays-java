# Quiet the SDK's own logging so the Worker tab shows the Workshop's output: the
# [ledger] lines and the Workflow's "unwinding" line. The SDK's per-Activity and
# per-Workflow failure stack traces stay out; the Event History in the Temporal
# UI has every failure in full.
org.slf4j.simpleLogger.defaultLogLevel=warn
org.slf4j.simpleLogger.log.io.temporal=error
org.slf4j.simpleLogger.log.io.temporal.devdays=info
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showShortLogName=true
